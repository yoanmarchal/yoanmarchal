<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Yoan Marchal — Web developer, Limoges France" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.06" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0d1117" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect width="1200" height="260" fill="url(#glow2)"/>

    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="72" y="118" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#0d1117">Yoan Marchal</text>
      <rect x="74" y="140" width="280" height="3" rx="1.5" fill="url(#rule)"/>
      <text x="72" y="182" font-size="23" font-weight="500" fill="#3d444d">Web developer · Limoges, France</text>
      <text x="72" y="214" font-size="17" font-weight="400" fill="#6a737d" letter-spacing="2.6">PHP · WORDPRESS · RUST · TYPESCRIPT · VUE</text>
    </g>

    <g transform="translate(1012 70)" opacity="0.75">
      <circle cx="58" cy="58" r="57" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
      <g>
        <circle cx="58" cy="58" r="43" fill="none" stroke="url(#rule)" stroke-width="2" stroke-dasharray="52 18" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0 58 58" to="360 58 58" dur="18s" repeatCount="indefinite"/>
      </g>
      <circle cx="58" cy="58" r="26" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
      <g>
        <circle cx="58" cy="15" r="5" fill="#06b6d4"/>
        <animateTransform attributeName="transform" type="rotate" from="360 58 58" to="0 58 58" dur="11s" repeatCount="indefinite"/>
      </g>
      <circle cx="58" cy="58" r="5" fill="#6366f1"/>
    </g>
    <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#d1d9e0" stroke-width="1"/>
  </g>
</svg>
